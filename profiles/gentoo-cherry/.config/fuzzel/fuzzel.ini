[main]
font=Terminess Nerd Font:size=14:antialias=false:autohint=true
use-bold=yes
dpi-aware=yes
gamma-correct=yes
prompt="# "
match-mode=fuzzy
match-counter=yes
terminal=foot-client
list-executables-in-path=yes
lines=12
width=20
horizontal-pad=12
vertical-pad=3
inner-pad=5
scaling-filter=cubic

[colors]
background=141414e6
text=333333
match=8b0000
selection=dcdcdc
selection-text=333333
border=333333cc

[border]
width=1
radius=0
