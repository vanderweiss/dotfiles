WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"
COMMON_FLAGS="-march=native -O3 -pipe -flto -ffat-lto-objects -fno-semantic-interposition -floop-block -fgraphite-identity -floop-parallelize-all ${WARNING_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

LDFLAGS="-Wl,-O2,--as-needed,--hash-style=gnu -flto -fuse-ld=mold"

MAKEOPTS="-j12"

ACCEPT_KEYWORDS="~amd64"

USE="alsa dbus flatpak graphite jit lto ibus modules-compress modules-sign orc pgo pipewire profile pulseaudio screencast vaapi vulkan wayland X -emacs -savedconfig"

EMERGE_DEFAULT_OPTS="--verbose"
ACCEPT_LICENSE="*"
FEATURES="nodoc noinfo notitles -news -sandbox -pid-sandbox -usersandbox"
VIDEO_CARDS="amdgpu radeon radeonsi"

#PORTAGE_TMPDIR="/tmp"

LC_MESSAGES=C.utf8

GENTOO_MIRRORS="https://mirror.reenigne.net/gentoo/ \
  https://172.83.105.10/gentoo/ \
  https://mirrors.mit.edu/gentoo-distfiles/"
